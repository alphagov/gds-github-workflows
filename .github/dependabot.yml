---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"              # Catches .github/workflows and root action.yml
      - "/*"             # Catches /comment-pr, /dispatcher, /pre-commit, /update-check
      - "/terraform/*"   # Catches /terraform/deps
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "aquasecurity/setup-trivy" # temporary ignore
