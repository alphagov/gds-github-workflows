name: Code Lint Checks
description: Run code linting checks - gitleaks, codespell, shellcheck, pymarkdown

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    type: string
    default: '3.x'
  pymarkdown-config:
    description: 'Path to pymarkdown config for modules directory'
    required: false
    default: 'terraform/modules/.pymarkdown.yaml'
  modules-directory:
    description: 'Modules directory with separate pymarkdown config'
    required: false
    default: 'terraform/modules'
  token:
    description: The GitHub App token to use to call the GitHub REST API
    required: true

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install tools
      shell: bash
      run: pip install -q codespell pymarkdownlnt

    - name: Gitleaks
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e# v3.0.0 v3
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Codespell
      shell: bash
      run: |
        # --toml /dev/null overrides any .codespellrc in the consuming repo
        # which may set write-changes = true (auto-fix mode).
        # CI should always check-only, never auto-fix.
        # Note: if your repo has skip patterns or custom dictionaries in .codespellrc
        # move them to a [codespell] section in pyproject.toml which this does not override.
        codespell --toml /dev/null

    - name: Shellcheck
      shell: bash
      run: find . -name "*.sh" -not -path "*/.terraform/*" | xargs shellcheck

    - name: Pymarkdown
      shell: bash
      run: |
        pymarkdown scan . --recurse --exclude ${{ inputs.modules-directory }}
        pymarkdown \
          --config ${{ inputs.pymarkdown-config }} \
          scan ${{ inputs.modules-directory }}
