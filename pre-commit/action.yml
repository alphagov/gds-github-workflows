name: pre-commit
description: Run pre-commit

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    type: string
    default: '3.x'
  pre-commit-version:
    description: 'Pre-commit version to use'
    required: false
    type: string
    default: 'latest'
  skip-hooks:
    description: 'Comma-separated list of hooks to skip'
    required: false
    type: string
    default: 'conventional-branch-name'
  hook-stages:
    description: 'Space-separated pre-commit hook stages (e.g. "pre-commit pre-push"). Empty runs the default stage.'
    required: false
    type: string
    default: ''
  all-files:
   default: true
   required: true
   type: boolean
   description: 'Set to true if pre-commit should run on all files'
  extra-args:
    description: 'Extra arguments to pass into the pre-commit executable'
    required: false
    type: string
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pre-commit
      shell: bash
      run: |
        echo "Install pre-commit"
        package_spec="pre-commit"
        version="${{ inputs.pre-commit-version || 'latest' }}"
        [ "$version" != "latest" ] && package_spec+="==$version"
        pip install \
          -q \
          "$package_spec"

    - name: Run pre-commit on all files
      env:
        SKIP: ${{ inputs.skip-hooks }}
        HOOK_STAGES: ${{ inputs.hook-stages }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        ALL_FILES_ARG: ${{inputs.all-files && '--all-files' || '' }}
      shell: bash
      run: |
        set -e
        read -r -a stages <<< "$HOOK_STAGES"
        if [ "${#stages[@]}" -eq 0 ]; then
          pre-commit run --color always --show-diff-on-failure $ALL_FILES_ARG $EXTRA_ARGS
        else
          args=()
          for stage in "${stages[@]}"; do
            args+=("--hook-stage" "$stage")
          done
          pre-commit run --color always --show-diff-on-failure $ALL_FILES_ARG "${args[@]}" $EXTRA_ARGS
        fi
